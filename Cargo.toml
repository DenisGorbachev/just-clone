[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/DenisGorbachev/just-clone"
repository = "https://github.com/DenisGorbachev/just-clone"
keywords = ["utils", "git"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "CLAUDE*.md",
    "deno.lock",
    "deno.json",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "rumdl.toml",
    "rustfmt.toml",
    ".yolobox"
]

[workspace.metadata.details]
name = "just-clone"
title = "Clone a repository from any URL"
readme = { }

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[package]
name = "just-clone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Clone a repository from any URL."
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[package.metadata.details]
title = "Clone a repository from any URL"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5.13", features = ["derive"] }
crates_io_api = { version = "0.11.0" }
derive-getters = { version = "0.5.0", features = ["auto_copy_getters"] }
derive-new = "0.7.0"
derive_more = { version = "2.1.1", features = ["full"] }
fmt-derive = "0.1.2"
git2 = "0.20.4"
helpful = { git = "https://github.com/DenisGorbachev/helpful" }
not-found-error = "0.2.1"
octocrab = { version = "0.43.0" }
#standard-traits = { git = "https://github.com/DenisGorbachev/standard-traits" }
#stub-macro = { version = "0.2.1" }
subtype = { git = "https://github.com/DenisGorbachev/subtype" }
tokio = { version = "1.39.2", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5.2"

[dev-dependencies]
tempfile = { version = "3.12.0" }
url-macro = "0.2.3"
#assert_matches = { version = "1.5.0" }

[package.metadata.cargo-machete]
ignored = ["stub-macro"]
